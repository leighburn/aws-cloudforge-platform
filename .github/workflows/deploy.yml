name: CloudForge CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cloudforge .

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            if [ ! -d "$HOME/aws-cloudforge-platform/.git" ]; then
              git clone https://github.com/leighburn/aws-cloudforge-platform.git "$HOME/aws-cloudforge-platform"
            fi

            cd "$HOME/aws-cloudforge-platform"
            git pull --ff-only origin main

            sudo docker build -t cloudforge .
            sudo docker rm -f cloudforge || true
            sudo docker run -d \
              --name cloudforge \
              --restart unless-stopped \
              -p 80:80 \
              cloudforge

            sudo docker ps